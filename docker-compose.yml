version: '3.9'

services:
  app:
    image: 'daily-sync-account2:latest'
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_FILE_PATH: /app/data/garmin.db
      DOWNLOAD_DIR: /app/data/garmin_fit_files
      PLAYWRIGHT_PROFILE_DIR: /app/data/playwright/account2
    ports:
      - '127.0.0.1:3000:3000'
    container_name: daily-sync-account2-app
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs

volumes:
  app_data:
  app_logs:
