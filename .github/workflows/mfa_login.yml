name: MFA Login (Account 2)

on:
  workflow_dispatch:
    inputs:
      mfa_code:
        description: '邮箱中收到的佳明6位验证码'
        required: true
        type: string

concurrency:
  group: account2-cn-sync-mfa
  cancel-in-progress: false

env:
  # Account 2 需要 MFA 验证
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME_2 }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_2 }}
  BARK_KEY: ${{ secrets.BARK_KEY }}
  MFA_CODE: ${{ github.event.inputs.mfa_code }}

jobs:
  mfa-login:
    runs-on: ubuntu-latest
    name: Complete MFA Login
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
      - name: Pull latest main
        run: |
          git pull --ff-only origin main
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
      - run: yarn
      - run: yarn mfa_login --code ${{ github.event.inputs.mfa_code }}
        timeout-minutes: 2
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Save Garmin Session after MFA Login
