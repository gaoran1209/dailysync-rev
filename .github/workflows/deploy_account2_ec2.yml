name: Deploy Account 2 Service to EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'db/**'
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          GARMIN_USERNAME_2: ${{ secrets.GARMIN_USERNAME_2 }}
          GARMIN_PASSWORD_2: ${{ secrets.GARMIN_PASSWORD_2 }}
          GARMIN_GLOBAL_USERNAME_2: ${{ secrets.GARMIN_GLOBAL_USERNAME_2 }}
          GARMIN_GLOBAL_PASSWORD_2: ${{ secrets.GARMIN_GLOBAL_PASSWORD_2 }}
          AESKEY: ${{ secrets.AESKEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ACCOUNT2_SYNC_WEBHOOK_TOKEN: ${{ secrets.ACCOUNT2_SYNC_WEBHOOK_TOKEN }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_IMAP_PORT: ${{ secrets.MAIL_IMAP_PORT }}
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=60 -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euo pipefail
          mkdir -p "${EC2_DEPLOY_PATH}"
          cd "${EC2_DEPLOY_PATH}"

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ ! -d .git ]; then
            git init
            git remote add origin "\${REPO_URL}"
          fi

          git remote set-url origin "\${REPO_URL}"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          git reset --hard FETCH_HEAD
          git clean -fdx

          cat > .env <<'ENVEOF'
          APP_BASE_URL=${APP_BASE_URL}
          GARMIN_USERNAME_2=${GARMIN_USERNAME_2}
          GARMIN_PASSWORD_2=${GARMIN_PASSWORD_2}
          GARMIN_GLOBAL_USERNAME_2=${GARMIN_GLOBAL_USERNAME_2}
          GARMIN_GLOBAL_PASSWORD_2=${GARMIN_GLOBAL_PASSWORD_2}
          AESKEY=${AESKEY}
          BARK_KEY=${BARK_KEY}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          ACCOUNT2_SYNC_WEBHOOK_TOKEN=${ACCOUNT2_SYNC_WEBHOOK_TOKEN}
          MAIL_IMAP_HOST=${MAIL_IMAP_HOST}
          MAIL_IMAP_PORT=${MAIL_IMAP_PORT}
          MAIL_IMAP_USER=${MAIL_IMAP_USER}
          MAIL_IMAP_PASSWORD=${MAIL_IMAP_PASSWORD}
          PORT=3000
          DB_FILE_PATH=/app/data/garmin.db
          DOWNLOAD_DIR=/app/data/garmin_fit_files
          PLAYWRIGHT_PROFILE_DIR=/app/data/playwright/account2
          ENVEOF

          # Build and start app container
          if command -v docker-compose &>/dev/null; then
            docker-compose up -d --build --force-recreate --remove-orphans
          elif docker compose version &>/dev/null; then
            docker compose up -d --build --force-recreate --remove-orphans
          else
            echo "Neither docker-compose nor docker compose found" && exit 1
          fi

          # Setup/refresh nginx reverse proxy (keep timeouts in sync with repo config).
          # certbot 已在既有配置上追加了 SSL server 块，所以只在缺少 proxy_read_timeout 更新时替换 HTTP 块超时
          if [ ! -f /etc/nginx/sites-available/dailysync-account2 ]; then
            sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/dailysync-account2
            sudo ln -sf /etc/nginx/sites-available/dailysync-account2 /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            echo "Nginx site config created and enabled"
          else
            sudo sed -i 's/proxy_read_timeout 120s;/proxy_read_timeout 600s;/' /etc/nginx/sites-available/dailysync-account2
            sudo nginx -t && sudo systemctl reload nginx
            echo "Nginx site config refreshed (timeouts)"
          fi

          # Setup SSL with certbot (idempotent)
          if [ ! -d /etc/letsencrypt/live/sync.gaoran.xyz ]; then
            sudo certbot --nginx -d sync.gaoran.xyz --non-interactive --agree-tos --register-unsafely-without-email --redirect
            echo "SSL certificate issued"
          else
            echo "SSL certificate already exists, skipping"
          fi
          EOF

      - name: Check deployed health endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS "${APP_BASE_URL%/}/health"; then
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60 seconds"
          exit 1
