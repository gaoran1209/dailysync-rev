name: Sync Garmin CN to Garmin Global (Account 2)

on:
  workflow_dispatch:
  schedule:
    #  每6小时检查一次
    - cron: "0 */6 * * *"

concurrency:
  group: account2-cn-sync-mfa
  cancel-in-progress: false

env:
  # 第二组账号配置
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME_2 }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_2 }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME_2 }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD_2 }}
  BARK_KEY: ${{ secrets.BARK_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Sync Garmin CN to Garmin Global (Account 2)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
      - name: Pull latest main
        run: |
          git pull --ff-only origin main
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
      - run: yarn
      - run: yarn sync_cn
        timeout-minutes: 5
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: Save Garmin Session (Account 2)
