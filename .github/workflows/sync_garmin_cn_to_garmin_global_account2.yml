name: Sync Garmin CN to Garmin Global (Account 2)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  trigger-account2-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger EC2 account 2 sync
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ACCOUNT2_SYNC_WEBHOOK_TOKEN: ${{ secrets.ACCOUNT2_SYNC_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          http_code=$(curl -sS -o .tmp/account2-sync-response.json -w "%{http_code}" \
            -X POST "${APP_BASE_URL%/}/api/hooks/sync/account2" \
            -H "Authorization: Bearer ${ACCOUNT2_SYNC_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json")

          cat .tmp/account2-sync-response.json

          sync_status=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('.tmp/account2-sync-response.json','utf8'); const data=JSON.parse(raw); process.stdout.write(data.status || 'unknown');")
          sync_message=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('.tmp/account2-sync-response.json','utf8'); const data=JSON.parse(raw); process.stdout.write(data.message || '');")

          echo "HTTP ${http_code}, status=${sync_status}"

          if [ "${http_code}" = "200" ] && { [ "${sync_status}" = "ok" ] || [ "${sync_status}" = "no_new_data" ] || [ "${sync_status}" = "partial" ] || [ "${sync_status}" = "skipped" ]; }; then
            exit 0
          fi

          if [ "${http_code}" = "409" ] && [ "${sync_status}" = "busy" ]; then
            echo "另一个同步任务正在执行，本次跳过"
            exit 0
          fi

          if [ "${sync_status}" = "reauth_required" ]; then
            echo "::error::Account 2 需要在 EC2 管理页重新登录 Garmin 国区账号。${sync_message}"
            exit 1
          fi

          echo "::error::Account 2 同步失败。${sync_message}"
          exit 1
