name: Request MFA Code (Account 2)

on:
  workflow_dispatch:

concurrency:
  group: account2-cn-sync-mfa
  cancel-in-progress: false

env:
  # Account 2 需要 MFA 验证
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME_2 }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_2 }}
  BARK_KEY: ${{ secrets.BARK_KEY }}

jobs:
  request-mfa:
    runs-on: ubuntu-latest
    name: Request Garmin CN MFA Code
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
      - run: yarn
      - run: yarn request_mfa
        timeout-minutes: 2
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Save MFA state
